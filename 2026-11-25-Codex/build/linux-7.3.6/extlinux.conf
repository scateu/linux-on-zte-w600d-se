DEFAULT ubuntu-xfce
TIMEOUT 50

LABEL ubuntu-xfce
    MENU LABEL Ubuntu XFCE - W600D - Linux 7.3.6
    LINUX /boot/Image
    FDT /boot/rk3568-zte-w600d-mainline.dtb
    APPEND earlycon=uart8250,mmio32,0xfe660000 console=tty1 console=ttyS2,115200n8 root=PARTUUID=24c0d202-02 rootwait rootdelay=5 rw init=/sbin/init clk_ignore_unused pd_ignore_unused cpuidle.off=1 usbcore.autosuspend=-1 loglevel=4

LABEL console-rescue
    MENU LABEL Same kernel - text login only
    LINUX /boot/Image
    FDT /boot/rk3568-zte-w600d-mainline.dtb
    APPEND earlycon=uart8250,mmio32,0xfe660000 console=tty1 console=ttyS2,115200n8 root=PARTUUID=24c0d202-02 rootwait rootdelay=5 rw init=/sbin/init systemd.unit=multi-user.target clk_ignore_unused pd_ignore_unused cpuidle.off=1 usbcore.autosuspend=-1

LABEL emergency-shell
    MENU LABEL Diagnostic shell - root read-only - do not exit PID1
    LINUX /boot/Image
    FDT /boot/rk3568-zte-w600d-mainline.dtb
    APPEND earlycon=uart8250,mmio32,0xfe660000 console=tty1 console=ttyS2,115200n8 root=PARTUUID=24c0d202-02 rootwait rootdelay=5 ro init=/bin/sh clk_ignore_unused pd_ignore_unused cpuidle.off=1 usbcore.autosuspend=-1
